<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>할 일 보드</title>
<style>
  :root{
    --bg:#fafafa;--surface:#ffffff;--ink:#1a1a1a;--ink-soft:#4a4a4a;--ink-faint:#8a8a8a;
    --line:#e6e6e6;--line-strong:#d4d4d4;--accent:#1a1a1a;--done:#a8a8a8;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;padding-bottom:80px;}
  #gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{width:100%;max-width:360px;text-align:center}
  .gate-card .lock{width:48px;height:48px;border-radius:14px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:22px}
  .gate-card .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:8px}
  .gate-card h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-bottom:22px}
  .gate-card input{width:100%;font-family:inherit;font-size:16px;text-align:center;letter-spacing:.3em;padding:14px;border:1.5px solid var(--line-strong);border-radius:11px;outline:none;transition:border .15s;background:#fff;color:var(--ink)}
  .gate-card input:focus{border-color:var(--ink)}
  .gate-card button{width:100%;margin-top:12px;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--ink);border:none;border-radius:11px;padding:14px;cursor:pointer;transition:opacity .15s}
  .gate-card button:hover{opacity:.85}
  .gate-card button:disabled{opacity:.5;cursor:default}
  .gate-err{color:#c0392b;font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
  header{position:sticky;top:0;z-index:50;background:rgba(250,250,250,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .head-inner{max-width:820px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;flex-direction:column;gap:2px}
  .brand .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .progress-wrap{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .progress-track{width:120px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .progress-bar{height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .35s ease}
  .progress-num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);min-width:42px;text-align:right}
  main{max-width:820px;margin:0 auto;padding:40px 28px 0}
  .goal-card{background:var(--ink);color:#fff;border-radius:16px;padding:26px 28px;margin-bottom:36px;box-shadow:var(--shadow)}
  .goal-card .label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;font-weight:600;margin-bottom:14px}
  .goal-card ul{list-style:none}
  .goal-card li{position:relative;padding-left:22px;font-size:14.5px;color:#ededed;margin:9px 0;line-height:1.55}
  .goal-card li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7}
  .goal-card strong{color:#fff;font-weight:700}
  section{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
  .sec-head{display:flex;align-items:center;gap:14px;padding:20px 26px;cursor:pointer;user-select:none;transition:background .15s}
  .sec-head:hover{background:#fbfbfb}
  .sec-num{flex-shrink:0;min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .sec-title{flex:1;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
  .sec-meta{font-size:12.5px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .chev{flex-shrink:0;color:var(--ink-faint);transition:transform .25s;font-size:13px}
  section.collapsed .chev{transform:rotate(-90deg)}
  section.collapsed .sec-body{display:none}
  .sec-body{padding:4px 26px 20px}
  .grp{margin-top:18px}
  .grp:first-child{margin-top:6px}
  .grp-title{font-size:13px;font-weight:700;color:var(--ink-soft);padding:6px 0 8px;letter-spacing:-.01em;border-bottom:1px dashed var(--line-strong);margin-bottom:6px}
  .item{display:flex;align-items:flex-start;gap:12px;padding:7px 0;cursor:pointer;border-radius:8px;transition:background .12s}
  .item:hover{background:#fafafa}
  .box{flex-shrink:0;margin-top:2px;width:19px;height:19px;border:1.8px solid var(--line-strong);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff}
  .box svg{width:11px;height:11px;opacity:0;transform:scale(.5);transition:all .15s;stroke:#fff;stroke-width:3.5;fill:none}
  .item.checked .box{background:var(--accent);border-color:var(--accent)}
  .item.checked .box svg{opacity:1;transform:scale(1)}
  .txt{font-size:14.5px;color:var(--ink);line-height:1.5;transition:color .15s}
  .txt small{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:2px}
  .item.checked .txt{color:var(--done);text-decoration:line-through;text-decoration-color:var(--line-strong)}
  .txt strong{font-weight:700}
  section.principle{border:1.5px solid var(--ink)}
  section.principle .sec-num{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
  .toolbar{max-width:820px;margin:30px auto 0;padding:0 28px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .btn{font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:9px 16px;cursor:pointer;transition:all .15s;letter-spacing:-.01em}
  .btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  footer{max-width:820px;margin:40px auto 0;padding:0 28px;font-size:12px;color:var(--ink-faint);text-align:center}
  @media(max-width:560px){.head-inner{padding:14px 18px;flex-wrap:wrap;gap:10px}.progress-track{width:90px}main{padding:28px 18px 0}.sec-head{padding:18px}.sec-body{padding:4px 18px 18px}}
</style>
</head>
<body>
<div id="gate">
  <div class="gate-card">
    <div class="lock">🔒</div>
    <div class="eyebrow">MY TODO BOARD</div>
    <h1>비밀번호를 입력하세요</h1>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" autofocus>
    <button id="enter">열기</button>
    <div class="gate-err" id="err"></div>
  </div>
</div>
<div id="content" style="display:none">
<header>
  <div class="head-inner">
    <div class="brand"><span class="eyebrow">MY TODO BOARD</span><h1>할 일 보드</h1></div>
    <div class="progress-wrap"><div class="progress-track"><div class="progress-bar" id="bar"></div></div><span class="progress-num" id="pnum">0%</span></div>
  </div>
</header>
<main>
  <div class="goal-card" id="goalCard" style="display:none"></div>
  <div id="sections"></div>
  <div class="toolbar">
    <button class="btn" id="expandAll">모두 펼치기</button>
    <button class="btn" id="collapseAll">모두 접기</button>
    <button class="btn" id="reset">전체 초기화</button>
  </div>
  <footer>체크 상태는 이 브라우저에 자동 저장됩니다</footer>
</main>
</div>

const CHECK_SVG='<svg viewBox="0 0 14 14"><polyline points="2,7.5 5.5,11 12,3"/></svg>';
let DATA=null, GOAL=null, total=0;
function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decryptWith(pw){
  const enc=new TextEncoder();
  const baseKey=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iters,hash:'SHA-256'},baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const gate=document.getElementById('gate'),contentEl=document.getElementById('content');
const pwInput=document.getElementById('pw'),enterBtn=document.getElementById('enter'),errEl=document.getElementById('err');
async function tryUnlock(pw){
  errEl.textContent='';enterBtn.disabled=true;enterBtn.textContent='확인 중…';
  try{
    const dec=await decryptWith(pw);
    GOAL=dec.goal;DATA=dec.sections;
    sessionStorage.setItem('cx_pw',pw);
    gate.style.display='none';contentEl.style.display='block';
    render();
  }catch(e){errEl.textContent='비밀번호가 올바르지 않습니다.';pwInput.value='';pwInput.focus();}
  finally{enterBtn.disabled=false;enterBtn.textContent='열기';}
}
enterBtn.addEventListener('click',()=>tryUnlock(pwInput.value));
pwInput.addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock(pwInput.value)});
const saved=sessionStorage.getItem('cx_pw');
if(saved){tryUnlock(saved);}
const KEY="todoboard_state_v1";
const state=JSON.parse(localStorage.getItem(KEY)||"{}");
const collapseKey="todoboard_collapse_v1";
const collapseState=JSON.parse(localStorage.getItem(collapseKey)||"{}");
function render(){
  const gc=document.getElementById("goalCard");
  if(GOAL && GOAL.items && GOAL.items.length){
    gc.style.display="block";
    gc.innerHTML='<div class="label">'+(GOAL.label||"")+'</div><ul>'+GOAL.items.map(g=>'<li>'+g+'</li>').join('')+'</ul>';
  }else{gc.style.display="none";}
  const root=document.getElementById("sections");
  root.innerHTML="";total=0;
  DATA.forEach((sec,si)=>{
    const secEl=document.createElement("section");
    if(sec.principle) secEl.classList.add("principle");
    if(collapseState[si]) secEl.classList.add("collapsed");
    const body=document.createElement("div");body.className="sec-body";
    sec.groups.forEach((g,gi)=>{
      const grp=document.createElement("div");grp.className="grp";
      if(g.g){const gt=document.createElement("div");gt.className="grp-title";gt.textContent=g.g;grp.appendChild(gt);}
      g.items.forEach((it,ii)=>{
        const id=si+"-"+gi+"-"+ii;total++;
        const item=document.createElement("div");
        item.className="item"+(state[id]?" checked":"");
        item.innerHTML='<div class="box">'+CHECK_SVG+'</div><div class="txt">'+it+'</div>';
        item.addEventListener("click",()=>{
          item.classList.toggle("checked");
          state[id]=item.classList.contains("checked");
          localStorage.setItem(KEY,JSON.stringify(state));
          updateProgress();updateSecMeta(secEl,sec,si);
        });
        grp.appendChild(item);
      });
      body.appendChild(grp);
    });
    const head=document.createElement("div");head.className="sec-head";
    head.innerHTML='<div class="sec-num">'+sec.n+'</div><div class="sec-title">'+sec.t+'</div><div class="sec-meta" data-meta="'+si+'"></div><div class="chev">▾</div>';
    head.addEventListener("click",()=>{
      secEl.classList.toggle("collapsed");
      collapseState[si]=secEl.classList.contains("collapsed");
      localStorage.setItem(collapseKey,JSON.stringify(collapseState));
    });
    secEl.appendChild(head);secEl.appendChild(body);root.appendChild(secEl);
    updateSecMeta(secEl,sec,si);
  });
  updateProgress();
}
function countSec(sec,si){let done=0,tot=0;sec.groups.forEach((g,gi)=>g.items.forEach((it,ii)=>{tot++;if(state[si+"-"+gi+"-"+ii])done++;}));return{done,tot};}
function updateSecMeta(secEl,sec,si){const{done,tot}=countSec(sec,si);secEl.querySelector('[data-meta="'+si+'"]').textContent=done+" / "+tot;}
function updateProgress(){let done=0;for(const k in state)if(state[k])done++;const pct=total?Math.round(done/total*100):0;document.getElementById("bar").style.width=pct+"%";document.getElementById("pnum").textContent=pct+"%";}
document.getElementById("expandAll").addEventListener("click",()=>{document.querySelectorAll("section").forEach((s,i)=>{s.classList.remove("collapsed");collapseState[i]=false;});localStorage.setItem(collapseKey,JSON.stringify(collapseState));});
document.getElementById("collapseAll").addEventListener("click",()=>{document.querySelectorAll("section").forEach((s,i)=>{s.classList.add("collapsed");collapseState[i]=true;});localStorage.setItem(collapseKey,JSON.stringify(collapseState));});
document.getElementById("reset").addEventListener("click",()=>{if(!confirm("모든 체크를 초기화할까요?"))return;for(const k in state)delete state[k];localStorage.setItem(KEY,JSON.stringify(state));render();});
</script>
